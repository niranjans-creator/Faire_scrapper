name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean faire_scraper.spec

      - name: Bundle Chromium for Playwright
        shell: pwsh
        run: |
          python -m playwright install chromium
          Copy-Item "$env:USERPROFILE\AppData\Local\ms-playwright" "dist\FaireScraper\ms-playwright" -Recurse

      - name: Create portable package
        shell: pwsh
        run: Compress-Archive -Path dist\FaireScraper\* -DestinationPath FaireScraper-Windows.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: FaireScraper-Windows
          path: FaireScraper-Windows.zip
